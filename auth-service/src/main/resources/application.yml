server:
  port: 8084

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:file:./data/auth-db;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

app:
  jwt:
    secret: ${APP_JWT_SECRET:louage-tracker-dev-secret-key-32-chars-min}
    expiry-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
