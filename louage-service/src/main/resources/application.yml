server:
  port: 8081

spring:
  application:
    name: louage-service
  datasource:
    url: jdbc:h2:file:./data/louage-db;AUTO_SERVER=TRUE   # own database
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
