server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # lb:// = load-balanced, the host is resolved through Eureka (no hardcoded URL)
        # /api/louages/1  ->  louage-service  /louages/1
        - id: louage-service
          uri: lb://louage-service
          predicates:
            - Path=/api/louages/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: station-service
          uri: lb://station-service
          predicates:
            - Path=/api/stations/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: trip-service
          uri: lb://trip-service
          predicates:
            - Path=/api/trips/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
