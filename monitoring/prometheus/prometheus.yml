global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]
        labels:
          application: eureka-server

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          application: api-gateway

  - job_name: louage-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["louage-service:8081"]
        labels:
          application: louage-service

  - job_name: station-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["station-service:8082"]
        labels:
          application: station-service

  - job_name: trip-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["trip-service:8083"]
        labels:
          application: trip-service
